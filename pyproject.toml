[project]
name = "fantasy21"
version = "0.1.0"
description = "NFL FanDuel lineup optimizer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4==4.12.3",
    "brotli",
    "draftfast",
    "numpy==2.0.1",
    "ortools==9.10.4067",
    "pandas==2.2.2",
    "requests==2.32.3",
    "scipy==1.14.0",
    "terminaltables==3.1.10",
    "zstandard",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "nose==1.3.7",
]

[tool.uv.sources]
draftfast = { git = "https://github.com/cbonoz/draftfast.git", branch = "master" }
