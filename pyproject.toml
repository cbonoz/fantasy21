[tool.poetry]
name = "fantasy21"
version = "0.1.0"
description = "NFL FanDuel lineup optimizer driven by draft.ipynb"
authors = ["Chris Buonocore"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
beautifulsoup4 = "==4.12.3"
brotli = "*"
numpy = "==2.0.1"
ortools = "==9.10.4067"
pandas = "==2.2.2"
requests = "==2.32.3"
scipy = "==1.14.0"
terminaltables = "==3.1.10"
zstandard = "*"
draftfast = { git = "https://github.com/cbonoz/draftfast.git", branch = "master" }

[tool.poetry.group.dev.dependencies]
nose = "==1.3.7"
ipykernel = "*"
jupyterlab = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
